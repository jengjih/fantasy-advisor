name: 下午 16:00 搶人提醒

on:
  schedule:
    - cron: "0 8 * * *"    # UTC 08:00 = 台北 16:00（美東剛進入新的一天）
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 比分迫近或場次落後才推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NBA_SOURCE: snapshot
        run: uv run python notify.py --mode afternoon
