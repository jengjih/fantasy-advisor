name: 每晚 22:00 今日指令

on:
  schedule:
    - cron: "0 14 * * *"   # UTC 14:00 = 台北 22:00（GitHub 排程偶爾會延遲幾分鐘）
  workflow_dispatch:        # 允許在 GitHub 網頁上手動觸發

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 產生並推播今日指令
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NBA_SOURCE: snapshot   # 讀 data-sync 存好的快照，速度快
        run: uv run python notify.py
